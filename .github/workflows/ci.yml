name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (lint + tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml

      - name: Install FFmpeg and gifsicle
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg gifsicle

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Lint
        run: |
          ruff check .
          ruff format --check .

      - name: Tests
        run: pytest -q

  frontend:
    name: Frontend (typecheck + tests + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Tests
        run: npm test

      - name: Build
        run: npm run build

  docker:
    name: Docker image builds
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -f docker/app.Dockerfile -t simple-gif-editor .

      - name: Smoke test
        run: |
          docker run -d --name app --read-only --tmpfs /tmp -p 8000:8000 simple-gif-editor
          for _ in $(seq 30); do
            curl -fsS http://localhost:8000/health && break
            sleep 1
          done
          curl -fsS http://localhost:8000/ -o index.html
          grep -q 'id="root"' index.html
          docker exec app ffmpeg -loglevel error -f lavfi \
            -i testsrc=duration=1:size=160x120:rate=25 -pix_fmt yuv420p /tmp/clip.mp4
          docker exec app cat /tmp/clip.mp4 > clip.mp4
          curl -fsS -F file=@clip.mp4 -F text=Smoke http://localhost:8000/api/convert -o clip.gif
          head -c 6 clip.gif | grep -q GIF89a

      - name: Container logs
        if: failure()
        run: docker logs app
